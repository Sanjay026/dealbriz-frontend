# Security headers, included by nginx.conf at server level AND inside every
# location that has its own add_header.
#
# Why both: nginx forgets the server-level add_header lines in any location
# that sets one of its own. index.html, admin.html, css/js and images all set
# Cache-Control, so before this file every real page came back with none of
# these headers, even though nginx.conf listed them.
#
# Installed by the Dockerfile as /etc/nginx/snippets/security-headers.conf.

# Clickjacking: only our own pages may frame ours (CSP frame-ancestors is the
# modern form, X-Frame-Options covers old browsers).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# camera=(self): the profile-picture "Take a photo" flow uses getUserMedia.
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
add_header X-XSS-Protection "0" always;
# HTTPS only for a year. No includeSubDomains: not every subdomain is known
# to serve HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
# A first CSP that can't break the site: no framing by other sites, no
# plugins, no <base> tag swaps. A full script policy needs the inline
# onclick= handlers moved into the JS files first.
add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
