# Proxy settings shared by every location that forwards to the Flask
# container. Installed by the Dockerfile as /etc/nginx/snippets/proxy-backend.conf.
proxy_pass http://backend:5000;
proxy_set_header Host $host;
# $remote_addr is the real visitor's IP (set_real_ip_from in nginx.conf).
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# $http_x_forwarded_proto preserves the ALB's value.
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
